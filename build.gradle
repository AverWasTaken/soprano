// git's line-ending warnings can fill stderr while we read stdout, leaving both processes waiting forever
def gitOutput = { List<String> arguments ->
    def process = new ProcessBuilder(['git'] + arguments)
            .directory(rootProject.projectDir)
            .redirectError(ProcessBuilder.Redirect.DISCARD)
            .start()
    def output = process.inputStream.getText('UTF-8')
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("git ${arguments.join(' ')} exited with ${exitCode}")
    }
    output
}

allprojects {
    apply plugin: 'java'
    apply plugin: "xyz.wagyourtail.unimined"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }

    def vers = ""
    try {
        vers = gitOutput(['describe', '--always', '--tags', '--first-parent', '--dirty']).trim()
    } catch (Exception e) {
        println "Version detection failed: " + e
    }
    if (rootProject.hasProperty("release_version")) {
        // the release workflow passes the tag in, so jar names can't depend on which other tags sit on the commit
        version = rootProject.release_version
        println "Release version " + version
    } else if (!vers.startsWith("v")) {
        println "using version number: " + rootProject.mod_version
        version = rootProject.mod_version
    } else {
        version = vers.substring(1)
        println "Detected version " + version
    }
    group = rootProject.maven_group

    java {
        sourceCompatibility = JavaVersion.toVersion(project.java_version)
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(sourceCompatibility.majorVersion.toInteger()))
        }
    }

    repositories {
        maven {
            url = "https://files.minecraftforge.net/maven/"
        }
        maven {
            name = 'spongepowered-repo'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'fabric-maven'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'impactdevelopment-repo'
            url = 'https://impactdevelopment.github.io/maven/'
        }
        maven {
            name = "ldtteam"
            url = "https://maven.parchmentmc.net/"
        }
        // for the newer version of launchwrapper
        maven {
            name = "multimc-maven"
            url = "https://files.multimc.org/maven/"
            metadataSources {
                artifact()
            }
        }
        // viafabricplus and the viaversion bits it drags along
        maven {
            name = "viaversion"
            url = "https://repo.viaversion.com"
            // only via stuff, everything else has no business being looked up here first
            content {
                includeGroup "com.viaversion"
            }
        }
        mavenCentral()
    }

    dependencies {
        compileOnly "org.spongepowered:mixin:${project.mixin_version}"
        compileOnly "org.ow2.asm:asm:${project.asm_version}"

        implementation 'com.google.code.findbugs:jsr305:3.0.2'
    }

    unimined.minecraft(sourceSets.main, true) {
        version rootProject.minecraft_version

        mappings {
            mojmap()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"

        def targetVersion = project.java_version.toInteger()
        if (JavaVersion.current().isJava9Compatible()) {
            it.options.release = targetVersion
        }
    }
}

unimined.minecraft {
    runs.off = true
    defaultRemapJar = false
}

base {
    archivesName = archivesName.get() + "-common"
}

sourceSets {
    api {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
    main {
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
    test {
        compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    }
    launch {
        compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    }
    schematica_api {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
    main {
        compileClasspath += schematica_api.output
        runtimeClasspath += schematica_api.output
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // compile against the api only, the real mod is optional and never shadowed. see baritone.utils.portal
    // transitive off because the api pom pins timestamped viaversion snapshots that the repo will purge someday,
    // and ProtocolVersion is the only viaversion type we touch anyway
    compileOnly("com.viaversion:viafabricplus-api:${viafabricplus_version}") { transitive = false }
    compileOnly('com.viaversion:viaversion-common:5.12.1') { transitive = false }
}

jar {
    from sourceSets.main.output, sourceSets.launch.output, sourceSets.api.output
}

javadoc {
    options.addStringOption('Xwerror', '-quiet') // makes the build fail on travis when there is a javadoc error
    options.linkSource true
    options.encoding "UTF-8" // allow emoji in comments :^)
    source = sourceSets.api.allJava
    classpath += sourceSets.api.compileClasspath
}

// the build id is for matching a log to the jar that wrote it. separate from the version logic up top,
// which falls back to a constant when the tag doesn't start with v
def buildId = "unknown"
try {
    def described = gitOutput(['describe', '--always', '--dirty']).trim()
    if (!described.isEmpty()) buildId = described
    if (buildId.endsWith("-dirty")) {
        // two edits on the same commit are two different jars, a short hash of the diff tells them apart (and only
        // changes when the diff does, so the resources stay up to date between builds of the same edit)
        def diff = gitOutput(['diff', 'HEAD'])
        buildId += "." + Integer.toHexString(diff.hashCode())
    }
} catch (Exception e) {
    println "Build id detection failed: " + e
}
def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss")

processResources {
    // the id is the input, the time is not: a time that changes every configure would redo the resources (and so
    // the tests and the jar) on every single build
    inputs.property "buildId", buildId
    filesMatching("adris/altoclef/build-id.properties") {
        expand "buildId": buildId, "buildTime": buildTime
    }
}
