# generated from Settings.java javadoc by SettingDescriptionsGenerator, do not edit
acceptableThrowawayItems=Blocks that Baritone is allowed to place (as throwaway, for sneak bridging, pillaring, etc.)
allowBoats=Take a boat across water if there's one in the inventory. When the path is about to enter a long enough stretch of open water (see boatMinWaterLength), baritone places the boat from the shore, climbs in, rows along the path, and at the far side breaks the boat and picks it back up (see boatPickup) before carrying on on foot. Water traversal is costed at rowing speed while a boat is in the inventory, so the planner will prefer going across a lake instead of around it. Only water with a straight row of at least boatMinWaterLength boatable blocks through it in both directions is priced that way, so a pond or a narrow river costs what wading does. A boat is wider than a block, so it only counts water with open water or air on every side at water level; the planner routes a block off the banks for the same reason. Bubble columns (water over magma blocks or soul sand) sink or launch boats, so water on or next to one is never rowed through. If the boat can't be placed or gets stuck, baritone gets out and continues the path the normal way.
allowBreak=Allow Baritone to break blocks
allowBreakAnyway=Blocks that baritone will be allowed to break even with allowBreak set to false
allowClimbJumps=Jump onto ladders and vines across a gap, and off of them again, instead of walking the long way round. Only actually takes effect if allowParkour is also true. Grabbing is a sprint jump (or a plain jump for the short ones) from flat floor, one to three blocks of gap, catching the ladder or vine mid air. A ladder has to be hanging on the far wall, vines can be caught from any side. Leaping goes the other way, climbing out sideways off a ladder or vine to land one block of gap away on the same level or a bit lower (or on another ladder or vine). You can't start sprinting while you're hanging on something, so leaps are short.
allowDiagonalAscend=Allow diagonal ascending. Actually pretty safe, much safer than diagonal descend tbh
allowDiagonalDescend=Allow descending diagonally. Safer than allowParkour yet still slightly unsafe, can make contact with unchecked adjacent blocks, so it's unsafe in the nether. For a generic "take some risks" mode I'd turn on this one, parkour, and parkour place.
allowDownward=Allow mining the block directly beneath its feet. Turn this off to force it to make more staircases and less shafts
allowGodBridge=Bridge backwards at walking speed without sneaking or stopping. When a bridge has nothing to place against except the block you are standing on, the bot turns around, walks backwards across the gap and places each block against the far face of the block underfoot the moment that face can be hit. The normal way is to crouch at the edge, aim, wait, click and shuffle on. This is riskier than the sneaking bridge. For a stretch of each block the bot hangs over the edge with no sneak clamp holding it, so a missed placement depends on it catching itself by sneaking at the last moment. Laggy servers and strict anticheats will not like it, and stopping the bot (or anything else that lets go of the keys) in the middle of a block can drop it off the edge, because it is still moving when that happens. Only bridges with no side placement option are affected, and only from plain footing. Anything slippery or slow under your feet (ice, slime, honey) keeps the sneaking bridge, and so does footing that opens when you click it (chests, furnaces, crafting tables and the like), water, and standing in anything climbable (ladders, vines, scaffolding and the like). Magma counts as plain unless allowWalkOnMagmaBlocks is on. Soul sand and half slabs can't be placed against from behind at all, sneaking or not, so they never get this far.
allowGroundShortcuts=Take direct ground routes across bends in flat walking paths, instead of visiting every block center. Only uses loaded terrain with clear body space and full solid support across the player's width. Jumps, climbs, block interactions, and hazardous or slippery terrain retain their normal movements, and an eligible sprint jump runway wins over a shortcut. Rechecks the route each tick and replans if it becomes obstructed. Part of fastMode.
allowInventory=Allow Baritone to move items in your inventory to your hotbar
allowJumpAtBuildLimit=If true, parkour is allowed to make jumps when standing on blocks at the maximum height, so player feet is y\=256. Defaults to false because this fails on constantiam. Please let me know if this is ever disabled. Please.
allowLadderClutch=Allow Baritone to survive a long fall by placing a ladder or vine on a wall next to the fall at the last moment, like a water bucket clutch but with a block you can carry in the nether. Needs a ladder or vine on the hotbar and a wall beside the last few blocks of the fall. The water bucket is still preferred when you have one. Reliability\: also questionable, it's all about the timing, and a clutch that misses is just the whole fall. The planner won't offer one below fastModeMinHealth for that reason, or for a drop a miss would kill you in. Part of fastMode.
allowMomentumJumps=Run up on the blocks behind a jump (and bunny hop on them if there's room) to make jumps a standing start can't\: a gap of four blocks on the flat, or one block up across a gap of three (both need a hop, so three or more blocks of flat floor behind the takeoff), jumps that land one to three blocks lower and reach out to five or six blocks (parkour never goes down, and these don't need a long run up), and a few pairs of jumps that land on a block in the middle and jump again on the very tick they touch down. Only actually takes effect if allowParkour is also true. Needs sprinting and a straight line along one direction. Drops are limited by maxFallHeightNoWater. The first time you play with this on, it takes a few seconds in the background to work out which jumps are possible, and the result is saved to momentum-table.txt in the baritone folder.
allowNeos=Jump around the end of a wall instead of walking the long way round, like a neo on a parkour map. Only actually takes effect if allowParkour is also true. Needs sprinting, and a block behind the jump to run up on. Handles walls one or two blocks thick, landing two to four blocks out.
allowOnlyExposedOres=This will only allow baritone to mine exposed ores, can be used to stop ore obfuscators on servers that use them.
allowOnlyExposedOresDistance=When allowOnlyExposedOres is enabled this is the distance around to search. It is recommended to keep this value low, as it dramatically increases calculation times.
allowOvershootDiagonalDescend=Is it okay to sprint through a descend followed by a diagonal? The player overshoots the landing, but not enough to fall off. And the diagonal ensures that there isn't lava or anything that's \!canWalkInto in that space, so it's technically safe, just a little sketchy. Note\: this is *not* related to the allowDiagonalDescend setting, that is a completely different thing.
allowParkour=You know what it is. But it's very unreliable and falls off when cornering like all the time so. It also overshoots the landing pretty much always (making contact with the next block over), so be careful
allowParkourAscend=This should be monetized it's so good. Defaults to true, but only actually takes effect if allowParkour is also true
allowParkourPlace=Place the block to land on in mid air, while doing a parkour jump, for gaps that are too wide to clear without it. Actually pretty reliable, but there is no taking it back\: once the jump is committed, a placement that misses in the air leaves nothing to land on, and that is a fall. Only actually takes effect if allowParkour is also true. Part of fastMode.
allowPlace=Allow Baritone to place blocks
allowPlaceInFluidsFlow=Allow Baritone to place blocks in flowing fluid
allowPlaceInFluidsSource=Allow Baritone to place blocks in fluid source blocks
allowSprint=Allow Baritone to sprint
allowSwimming=Actually swim through water instead of bobbing along the bottom of it. Swimming works the same way it does for a player\: hold sprint (ctrl) while in water to enter the swim state, then steer with yaw and pitch towards the goal. Since sprinting is what keeps the swim state alive, this requires allowSprint and enough hunger to sprint; without it, baritone falls back to the normal walk-on-the-bottom behavior. Water traversal is also costed at swim speed when this is on, unless depth strider makes walking the bottom the faster option.
allowTungstenJumps=Tungsten jumps\: jumps at any angle, not just the four straight lines the other parkour moves know. Diagonal gaps, jumps to a block off to the side, drops across a gap, from any block with a drop next to it to a block up to about six away, one up to three down. Each one is checked by playing it out in the player physics simulation (run at it, jump at the edge or a bit before, steer in the air, brake on the landing) and only planned if that lands and stops on the block. The jump is flown by the same rule, re-planned from where the player really is every tick, and if that ever finds nothing it falls back on a full Tungsten search over the keys themselves. Credit to Tungsten (github.com/Hackerokuz/Tungsten) for the idea. Planning these costs a lot more than a normal move, see tungstenPlannerBudget. Falls that hurt are never planned. Part of fastMode.
allowVines=Enables some more advanced vine features. They're honestly just gimmicks and won't ever be needed in real pathing scenarios. And they can cause Baritone to get trapped indefinitely in a strange scenario. Almost never turn this on lol
allowWalkOnBottomSlab=Slab behavior is complicated, disable this for higher path reliability. Leave enabled if you have bottom slabs everywhere in your base.
allowWalkOnMagmaBlocks=Sneak when magma blocks are under feet
allowWaterBucketFall=Allow Baritone to fall up to maxFallHeightBucket blocks and place a water bucket beneath it. Reliability\: questionable, and a miss is the whole fall, so the planner only offers a drop while you would survive that.
altoAreasToProtect=Areas Soprano will not break or place blocks in, for spawn protection or against griefing. Each one is x1/y1/z1->x2/y2/z2 (corners in any order, both inclusive) with @nether or @end on the end for other dimensions, and they are separated by commas, for example -10/0/-10->10/255/10,1000/50/2000->1200/255/2100@nether.
altoAsyncCooking=Same as altoAsyncSmelting but for cooking food in a smoker or furnace. Only does anything while altoAsyncSmelting is on as well (\#gamer turns that on for the phases that can come back for the food), so this is the switch for "iron cooks in the background but I want the bot to stand there for the meat".
altoAsyncSmelting=When smelting iron ingots, put everything in the furnace, close it and finish instead of standing there for the whole cook. The smelt is then recorded as a furnace job that something else has to come back for, so this is off for a plain @get iron_ingot (nobody would collect) and \#gamer turns it on only while its iron phase can.
altoAutoCloseScreenWhenLookingOrMining=Close the open screen (furnace, crafting table, chest...) when the look direction changes or the bot is mining something. Stops the bot from getting stuck in a container screen.
altoAutoEat=Eat when hungry or in danger.
altoAutoMLGBucket=Do a no fall bucket (MLG) when knocked off course and falling.
altoAutoReconnect=Reconnect to the last server automatically when disconnected. Off, and the bot stops running when you get disconnected.
altoAutoRespawn=Respawn right away when you die. Off, and the bot stops running when you die.
altoAvoidDrowning=Avoid going underwater when pathing is not giving the bot movement instructions. Turn it off if you want the bot to be able to sink.
altoAvoidOceanBlocks=Ignore mining and interacting with blocks below an ocean (in an ocean biome and below y 64). Soprano does not know what to do with oceans.
altoAvoidSearchingDungeonChests=When going to the nearest chest to store items the bot would dig up dungeons all day. With this on it searches around each chest first to make sure it is not in one.
altoButler=Let other players whisper Soprano commands to your player (/msg yourbot get cobblestone 4). Only players in the whitelist file baritone/altoclef/altoclef_butler_whitelist.txt (one name per line, case does not matter) may, and an empty or missing whitelist means nobody can, so this does nothing until you add someone with the whitelist command. The blacklist file next to it is applied on top and wins. Whispers can only run Soprano's commands, not Baritone's own, and never punk, gamma or whitelist. A whispered come walks to the player who sent it. Strangers get no answer unless replyToUnauthorized is on in butler.json. On by default. Whisper parsing is set up in baritone/altoclef/configs/butler.json.
altoCollectPickaxeFirst=Before grabbing anything, get a pickaxe. Helps with navigation because dropped items are sometimes underground, but it only makes sense in regular worlds.
altoCommitCombat=Mobs are ignored by default, in every dimension\: the bot keeps walking its path past a crowd of zombies, a lit creeper, or a skeleton shooting at it from across the field (walking spoils the aim). It only does something about a mob that hit it while in contact (a fight), or real danger\: 8 hp or less with an angry mob within 8 blocks, 10 hp or less with a heavy hitter like a wither skeleton, hoglin or vindicator that hit it or is in contact (one just standing around is walked past), or the warden or the wither within 8 (or a sonic boom from up to 15) (a run). A fight holds until its target is dead or has been more than 6 blocks away and quiet for three seconds, and turns into a run on the danger rules. A run holds until the bot is 24 blocks from where it started with nothing hostile within 12, or 25 seconds, whichever comes first. A run that gets nowhere (three seconds with a mob on top of the bot, six with one within eight blocks) becomes a fight, and one that gets nowhere with nothing near is over after five. A few things are left to the tasks that own them\: ghasts, the dragon, blazes while the rod task is working them, a golem being fought from its pillar. Off, the bot never commits to anything, which is the same as turning off altoKillOrAvoidAnnoyingHostiles. Needs altoKillOrAvoidAnnoyingHostiles.
altoContainerItemMoveDelay=The delay in seconds between moving items for crafting, furnaces and any other kind of inventory movement.
altoDeathCommand=What to do after dying, once we are back. {deathmessage} is replaced by the death message. Starting with \# (or the prefix) it is a command, starting with / it goes to the server as a command, anything else is sent as chat. Several can be chained with " & ", for example /home & i died with message\: {deathmessage & \#get diamond}. Empty does nothing.
altoDodgeProjectiles=Dodge incoming projectiles. Needs altoMobDefense.
altoDontThrowAwayCustomNameItems=Never throw away items that have a custom name.
altoDontThrowAwayEnchantedItems=Never throw away enchanted items.
altoEarlyIronPick=\#gamer's iron phase makes its iron pickaxe, iron chestplate, shield and shears (whichever the kit still owes, 14 raw iron for all four) as soon as it holds the ore for them, instead of mining the whole kit's worth first with a stone pick and no armor\: that ore is smelted where the bot stands, it keeps mining nearby while it cooks, then comes back and crafts them. it fires again if a death loses any of them. needs altoAsyncSmelting for the "mine while it cooks" part, without it the ore is smelted standing at the furnace and the crafts come right after.
altoEntityReachRange=How close we must be to attack or interact with an entity. See blockReachDistance for blocks. Melee swings are aimed and never reach further than the player's own entity interaction range (3 for a normal player), so for fighting this can only make the reach shorter. Trading, shearing and other interactions still use it as is.
altoExtinguishSelfWithWater=Put ourselves out with water when we are on fire (and not immune to it).
altoFoodKeepUnits=How much food to hold on to when making room. Counted in hunger points times how many you carry, with raw meat at its cooked value, so a stack of 8 steak is 64. Food is only ever thrown away when the rest of the bag still covers this, and then only the smallest stack that is pure surplus, after everything else that can go. Under it, food is never thrown away to make room. 0 turns this off. The gamer raises it while it runs.
altoFoodUnitsToCollect=How much food (in food points) to collect when there is less than altoMinimumFoodAllowed in the inventory.
altoForceFieldStrategy=How the force field behaves while altoMobDefense is on. It is there to push mobs away, not to kill them. FASTEST attacks every hostile at every possible moment, DELAY attacks the closest one when the attack is charged up, SMART attacks the closest one at most every 0.2 seconds, OFF does nothing.
altoGamerHud=The \#gamer card on the right of the screen while a run is going\: the phase and its clock against the budget, what the bot is doing, the kit it is collecting with the game's own item icons, the furnace batches, and hp and food. Sized by altoHudScale like the task list. The task list keeps the phase as its one line.
altoHideAllWarningLogs=Hide all of Soprano's warning logs. Not recommended, it makes debugging harder, but if you know what you are doing go nuts.
altoHomeBasePosition=Where the "home base" is. Some tasks (like altoOverworldToNetherBehaviour) use it when told to, don't bother with it unless you need it.
altoHudDetailed=Show the task list the way the developers see it\: class names, item id lists and the raw task states, the same text that goes into the log. Off, the list is written in plain words. Turn it on when you are putting together a bug report. Needs altoShowTaskChains.
altoHudScale=Size of the task list on top of the game's gui scale. 1 is the normal size, 0.75 is a nice small one. Values outside 0.5 to 2 are clamped. Needs altoShowTaskChains.
altoIdleCommand=A command to run when nothing else is going on, for example idle to keep surviving, follow <your name> or goto <home base coordinates>. Only used with altoRunsWhenIdle. Empty does nothing.
altoImportantItems=Items that are never thrown away, even when altoThrowAwayUnusedItems is on and the task does not use them.
altoIronArbiter=\#gamer only, the IRON phase. One chooser decides what the bot is doing (a furnace trip, a station pickup, a village chest, a coal detour, the climb out of the mine, the kit) and an activity that started holds until it is done, instead of the side jobs and the furnace trips each cutting in on every tick. Turn it off to get the older fixed order back for comparison. Every change of activity goes to the log as an activity\: line.
altoJumpCrits=Jump for critical hits in melee. When a mob is in reach and the weapon is a few ticks from full strength the bot hops in place, drops sprint, and swings once it is coming down, which is a crit for 1.5x damage. It never hops with a shield up (kiting and standing your ground), while eating, in water or lava, on a ladder, with a ceiling right over its head, next to a ledge or lava, while baritone is walking a path, or when a plain hit already kills. Off means every swing is a plain one the moment the cooldown is full.
altoKillOrAvoidAnnoyingHostiles=Skeletons and big groups of mobs are a pain. With this on the bot may fight or run from mobs that really need dealing with, see altoCommitCombat for what that means. Off, the bot never commits to a fight or a run, mobs are scenery (the safety stays\: fire, falls, the arrow shield and the force field swinging at what is hitting it). Needs altoMobDefense.
altoLavaPoolPortal=Build the \#gamer nether portal on a lava pool with a throwaway mold instead of casting obsidian one block at a time. Needs a lava row at least four wide with a shore along it and room to scoop from. When it cannot find one, or anything goes wrong with it, the gamer falls back to the old per block cast, so this only ever makes the portal faster. Turn it off to always cast.
altoLimitFuelsToSupportedFuels=Only use the items in altoSupportedFuels as smelting fuel. Careful with turning this off\: every burnable item that is not protected (blaze rods, beds, wooden tools, crafting tables...) can get burned.
altoMinimumFoodAllowed=Minimum amount of food (in food points) to keep in the inventory. Below this the bot goes and gets more, up to altoFoodUnitsToCollect. 0 means it never goes looking for food on its own.
altoMobDefense=Run away from hostile mobs when health is low, from creepers that are about to blow up and from very dangerous mobs like wither skeletons, and use the force field (altoForceFieldStrategy) to push mobs away.
altoNearbyBlastFurnaceRange=How far away, in blocks, a blast furnace can be and still count as nearby for altoUseNearbyBlastFurnace.
altoNetherFastTravelWalkingRange=When fast traveling through the nether, walk to the destination if we somehow end up closer than this many blocks in the overworld. Normal travel gets well within this (to about 100 blocks), so keep it decently large.
altoOverworldToNetherBehaviour=What to do when it needs the nether but there is no portal in sight. BUILD_PORTAL_VANILLA builds one, GO_TO_HOME_BASE walks to altoHomeBasePosition and assumes there is a portal there.
altoPickupItemsInWater=Go after dropped items that are lying in water. Off by default\: the bot ignores items that are in water unless it can grab them from dry land (or from a puddle one block deep), because swimming down after a drop is a good way to spend a whole run bobbing in a lake. Turn this on for the old behaviour. The watchdog that gives up on a drop when the bot is in water and not getting any closer stays on either way.
altoReservedBuildingBlockCount=How many throwaway blocks to keep around as building blocks.
altoResourceChestLocateRange=Chests are remembered along with what is in them. If the bot is collecting a resource and there is a chest with it within this many blocks, it takes it from the chest. 0 disables chest pickups. Don't set this too high, the bot will go for a chest even when the resource is lying right there.
altoResourceMineRange=Some block resources are normally made rather than mined (a crafting table comes from planks), but if one is found within this many blocks the bot may mine it instead. 0 disables that, -1 always mines a catalogued block (not recommended\: it will walk 10000 blocks to a crafting table it saw once, with a forest next to it).
altoResourcePickupDropRange=If a dropped resource item is further than this from the player, don't pick it up. Less than 0 disables the limit.
altoRunsWhenIdle=Keep Soprano's survival chains (eating, mob defense, bucket saves...) running even when no task was started, and run altoIdleCommand when it has nothing to do. With this off Soprano does nothing at all until you start a task, and goes back to doing nothing when the task ends. Takes effect right away.
altoShowTaskChains=Show the task list of Soprano in the top left corner while it is running.
altoShowTimer=Show how long the current task has been running in the task list. Needs altoShowTaskChains.
altoSleepAtNight=\#gamer and survival schematic builds. When night falls and the bot has a bed to use (one in the bag, the wool and planks to craft one, or one standing close by) it sleeps through the night instead of working on and fighting mobs until morning. Minecraft refuses to let anyone sleep with monsters near the bed, so when there are some the bot does not fight them\: it pillars up out of their range, puts the bed on top and sleeps there. A bed the bot placed itself is picked up again afterwards. Never used in the Nether or the End. It tries to have the bed ready before dusk\: in the last couple of minutes of the day it crafts one from wool and planks it already holds, and in the last four minutes, with sheep close by and no wool, it hunts three wool of one colour first (150 seconds at most, then it leaves it for the evening). With no bed and no wool it works the night as before. A schematic build stops the builder for the night (and for the evening's wool or craft), then walks back and counts again in the morning before building on. The pillar only uses blocks held above what the rest of the build needs.
altoSupportedFuels=The only things used as smelting fuel while altoLimitFuelsToSupportedFuels is on.
altoThrowAwayUnusedItems=If we need to throw something away and have no altoThrowawayItems, throw away any item that is not needed by the current task. Careful\: with this on anything not in altoImportantItems can go.
altoThrowawayItems=If we need to throw something away, throw these first. It is also what the bot may place as building blocks, and it is added to acceptableThrowawayItems while a task runs.
altoUseBlastFurnace=Craft or place a blast furnace of our own for smelting ores when that is worth it (five or more to smelt, plus the five iron and the smooth stone it costs). This is only about making one\: a blast furnace that is already standing nearby is altoUseNearbyBlastFurnace's business, and that works with this off. \#gamer turns this off for the run because the five iron is better spent on armor.
altoUseNearbyBlastFurnace=Smelt raw iron and gold in a blast furnace that is already standing nearby (a village armorer has one) instead of a plain furnace, since a blast furnace smelts ores twice as fast. It never crafts or places one, that is altoUseBlastFurnace. Nearby means within altoNearbyBlastFurnaceRange blocks of us when we start smelting a batch, and it sticks with whatever it picked until that batch is done.
antiCheatCompatibility=Will cause some minor behavioral differences to ensure that Baritone works on anticheats. At the moment this will silently set the player's rotations when using freeLook so you're not sprinting in directions other than forward, which is picken up by more "advanced" anticheats like AAC, but not NCP.
askToGatherForPath=On a trip you started yourself (goto, come, waypoints goto, or clicking a block in the click to go screen), ask before collecting blocks the path needs. It asks when the goal can't be reached without placing blocks you don't have, or when a path that needs blocks (or a stone pickaxe) is a lot faster, see fasterPathMinPercent and fasterPathMinSeconds. The question has clickable Yes and No buttons in chat (typing \#gather yes or \#gather no works too) and is asked at most once per trip. The answer holds until the trip ends\: arriving, stop, a new trip, dying or changing dimension. Yes collects about what the path needs (through Soprano) and carries on to the goal. Off means the old behavior\: the path fails and the bot stops, nothing is asked.
assumeExternalAutoTool=Disable baritone's auto-tool at runtime, but still assume that another mod will provide auto tool functionality. Specifically, path calculation will still assume that an auto tool will run at execution time, even though Baritone itself will not do that.
assumeSafeWalk=Assume safe walk functionality; don't sneak on a backplace traverse. Warning\: if you do something janky like sneak-backplace from an ender chest, if this is true it won't sneak right click, it'll just right click, which means it'll open the chest instead of placing against it. That's why this defaults to off.
assumeStep=Assume step functionality; don't jump on an Ascend.
assumeWalkOnLava=If you have Fire Resistance and Jesus then I guess you could turn this on lol
assumeWalkOnWater=Allow Baritone to assume it can walk on still water just like any other block. This functionality is assumed to be provided by a separate library that might have imported Baritone. Note\: This will prevent some usage of the frostwalker enchantment, like pillaring up from water.
autoTool=Automatically select the best available tool
autoTorch=Place torches in dark spots near you while Baritone is busy mining or walking. Needs torches in the hotbar (or the inventory with allowInventory). It only places while another process (mine, goto, explore, a task like \#get...) is running, never while building, in the Nether or the End, or near water and lava. Spots with sky light above autoTorchLightLevel are left alone, so the surface does not get covered in torches.
autoTorchLightLevel=autoTorch places a torch where both the block light and the sky light are at or below this (0 to 15). Spacing between torches falls out of this\: higher means more torches closer together.
autoTorchRadius=How far around you autoTorch looks for dark spots, in blocks. Never further than blockReachDistance
avoidBelowY=Never plan to stand below this height (a parkour level's floor, where the server puts you back to the start or the last checkpoint). Off at its default. See learnFallFloor for working it out by itself.
avoidBreakingMultiplier=this multiplies the break speed, if set above 1 it's "encourage breaking" instead
avoidUpdatingFallingBlocks=If this setting is true, Baritone will never break a block that is adjacent to an unsupported falling block. I.E. it will never trigger cascading sand / gravel falls
avoidance=Toggle the following 4 settings. They have a noticeable performance impact, so they default off. Specifically, building up the avoidance map on the main thread before pathing starts actually takes a noticeable amount of time, especially when there are a lot of mobs around, and your game jitters for like 200ms while doing so
axisHeight=The "axis" command (aka GoalAxis) will go to a axis, or diagonal axis, at this Y level.
backfill=Fill in blocks behind you
backtrackCostFavoringCoefficient=Set to 1.0 to effectively disable this feature
blacklistClosestOnFailure=When GetToBlockProcess or MineProcess fails to calculate a path, instead of just giving up, mark the closest instance of that block as "unreachable" and go towards the next closest. GetToBlock expands this search to the whole "vein"; MineProcess does not. This is because MineProcess finds individual impossible blocks (like one block in a vein that has gravel on top then lava, so it can't break) Whereas GetToBlock should blacklist the whole "vein" if it can't get to any of them.
blockBreakAdditionalPenalty=This is just a tiebreaker to make it less likely to break blocks if it can avoid it. For example, fire has a break cost of 0, this makes it nonzero, so all else being equal it will take an otherwise equivalent route that doesn't require it to put out fire.
blockBreakSpeed=How many ticks between breaking a block and starting to break the next block. Default in game is 6 ticks. Values under 1 will be clamped. The delay only applies to non-instant (1-tick) breaks.
blockFreeLook=Break and place blocks without having to force the client-sided rotations. Requires freeLook.
blockPlacementPenalty=It doesn't actually take twenty ticks to place a block, this cost is so high because we want to generally conserve blocks which might be limited. Decrease to make Baritone more often consider paths that would require placing blocks
blockReachDistance=Block reach distance
blocksToAvoid=Blocks that Baritone will attempt to avoid (Used in avoidance)
blocksToAvoidBreaking=blocks that baritone shouldn't break, but can if it needs to.
blocksToDisallowBreaking=Blocks that Baritone is not allowed to break. Bee nests and beehives are on it by default, because breaking one lets out a swarm of angry bees. Clear the list to allow breaking them again.
boatBoardCost=What the planner charges, in ticks, for stepping from land (or from water that isn't worth a boat) onto a stretch it would row\: getting the boat out, aiming it at the water and climbing in. Without it the shore end of a crossing is free, so the planner would hop out of the boat for a short walk over an island and put it back in. Higher means it goes around islands and spits of land more willingly, lower means it cuts across them. Only applies while allowBoats is on and there is a boat to row.
boatExitCost=Same idea as boatBoardCost for the other end of a row\: breaking the boat and waiting for the item to come back to us, in ticks. Slower than boarding because the boat takes five hits to break and the dropped item can't be picked up right away. Charged with boatPickup off too\: leaving the boat behind for good is no cheaper a thing to plan on.
boatMinWaterLength=Placing, boarding and scuttling a boat costs a few seconds, so don't bother for a puddle. This is the number of consecutive water blocks the path has to cross before allowBoats uses the boat.
boatPickup=Break the boat and pick it back up when leaving the water, so it can be used again. When off, baritone just climbs out and leaves the boat behind.
brakeAscends=Back up before a hop up a block when the sim says the player is too close to the face to jump from where it stands. A sprint hop clips the face of the step if it starts too close, and standing flush against it nothing but backing up helps. The sim looks for a few ticks of W held while facing away from the step (backwards, so the player slows down and rolls back), then forward again and the usual jump, and takes it only when that gets over the step cleanly and no later than jumping on the spot would. Vanilla only ends a sprint when forward is let go of, and W held is forward whatever the yaw says, so the sprint survives the whole thing. The plan is followed without searching again for as long as the player does what the sim said it would. This turns the player's facing a half circle away from where it is going for a tick or three, which an anticheat that checks the sprint direction against the movement direction can look at funny. Turn it off on servers like that.
breakCorrectBlockPenaltyMultiplier=Multiply the cost of breaking a block that's correct in the builder's schematic by this coefficient
breakFromAbove=Allow standing above a block while mining it, in BuilderProcess. Experimental
buildIgnoreBlocks=A list of blocks to be treated as if they're air. If a schematic asks for air at a certain position, and that position currently contains a block on this list, it will be treated as correct.
buildIgnoreDirection=If this is true, the builder will ignore directionality of certain blocks like glazed terracotta.
buildIgnoreExisting=If this is true, the builder will treat all non-air blocks as correct. It will only place new blocks.
buildIgnoreProperties=A list of names of block properties the builder will ignore.
buildInLayers=Don't consider the next layer in builder until the current one is done
buildOnlySelection=Only build the selected part of schematics
buildRepeat=How far to move before repeating the build. 0 to disable repeating on a certain axis, 0,0,0 to disable entirely
buildRepeatCount=How many times to buildrepeat. -1 for infinite.
buildRepeatSneaky=Don't notify schematics that they are moved. e.g. replacing will replace the same spots for every repetition Mainly for backward compatibility.
buildSchematicMirror=Mirrors the schematic before building it. Possible values are FRONT_BACK - mirror the schematic along its local x axis LEFT_RIGHT - mirror the schematic along its local z axis
buildSchematicRotation=Rotates the schematic before building it. Possible values are NONE - No rotation CLOCKWISE_90 - Rotate 90\u00B0 clockwise CLOCKWISE_180 - Rotate 180\u00B0 clockwise COUNTERCLOCKWISE_90 - Rotate 270\u00B0 clockwise
buildSkipBlocks=A list of blocks to be treated as correct. If a schematic asks for any block on this list at a certain position, it will be treated as correct, regardless of what it currently is.
buildSubstitutes=A mapping of blocks to blocks to be built instead. If a schematic asks for a block on this mapping, Baritone will place the first placeable block in the mapped list. Usage Syntax\: sourceblockA->blockToSubstituteA1,blockToSubstituteA2,...blockToSubstituteAN,sourceBlockB->blockToSubstituteB1,blockToSubstituteB2,...blockToSubstituteBN,...sourceBlockX->blockToSubstituteX1,blockToSubstituteX2...blockToSubstituteXN Example\: stone->cobblestone,andesite,oak_planks->birch_planks,acacia_planks,glass
buildValidSubstitutes=A mapping of blocks to blocks treated as correct in their position. If a schematic asks for a block on this mapping, all blocks on the mapped list will be accepted at that location as well. Syntax same as buildSubstitutes
builderTickScanRadius=Distance to scan every tick for updates. Expanding this beyond player reach distance (i.e. setting it to 6 or above) is only necessary in very large schematics where rescanning the whole thing is costly.
cachedChunksExpirySeconds=Cached chunks (regardless of if they're in RAM or saved to disk) expire and are deleted after this number of seconds -1 to disable. I would highly suggest leaving this setting disabled (-1). The only valid reason I can think of enable this setting is if you are extremely low on disk space and you play on multiplayer, and can't take (average) 300kb saved for every 512x512 area. (note that more complicated terrain is less compressible and will take more space). However, simply discarding old chunks because they are old is inadvisable. Baritone is extremely good at correcting itself and its paths as it learns new information, as new chunks load. There is no scenario in which having an incorrect cache can cause Baritone to get stuck, take damage, or perform any action it wouldn't otherwise, everything is rechecked once the real chunk is in range. Having a robust cache greatly improves long distance pathfinding, as it's able to go around large scale obstacles before they're in render distance. In fact, when the chunkCaching setting is disabled and Baritone starts anew every time, or when you enter a completely new and very complicated area, it backtracks far more often because it has to build up that cache from scratch. But after it's gone through an area just once, the next time will have zero backtracking, since the entire area is now known and cached.
cachedChunksOpacity=0.0f \= not visible, fully transparent (instead of setting this to 0, turn off renderCachedChunks) 1.0f \= fully opaque
cancelOnGoalInvalidation=Cancel the current path if the goal has changed, and the path originally ended in the goal but doesn't anymore. Currently only runs when either MineBehavior or FollowBehavior is active. For example, if Baritone is doing "mine iron_ore", the instant it breaks the ore (and it becomes air), that location is no longer a goal. This means that if this setting is true, it will stop there. If this setting were off, it would continue with its path, and walk into that location. The tradeoff is if this setting is true, it mines ores much faster since it doesn't waste any time getting into locations that no longer contain ores, but on the other hand, it misses some drops, and continues on without ever picking them up. Also on cosmic prisons this should be set to true since you don't actually mine the ore it just gets replaced with stone.
censorCoordinates=Censor coordinates in goals and block positions
censorRanCommands=Censor arguments to ran commands, to hide, for example, coordinates to \#goal
chatControl=Allow chat based control of Baritone. Most likely should be disabled when Baritone is imported for use in something else
chatControlAnyway=Some clients like Impact try to force chatControl to off, so here's a second setting to do it anyway
chatDebug=Print all the debug messages to chat
checkForUpdates=Ask GitHub once per session, when the title screen first opens, whether a newer Soprano release exists for the Minecraft version and release channel you are on, so the title screen can offer to update. Nothing is downloaded unless you click update. Turning this off stops the check, but an update that was already downloaded still gets finished.
chunkCaching=The big one. Download all chunks in simplified 2-bit format and save them for better very-long-distance pathing.
chunkPackerQueueMaxSize=The chunk packer queue can never grow to larger than this, if it does, the oldest chunks are discarded. The newest chunks are kept, so that if you're moving in a straight line quickly then stop, your immediate render distance is still included
colorBestPathSoFar=The color of the best path so far
colorBlocksToBreak=The color of the blocks to break
colorBlocksToPlace=The color of the blocks to place
colorBlocksToWalkInto=The color of the blocks to walk into
colorBoatPath=The color of the parts of a path that will be crossed by boat (see allowBoats). Water that will be swum or waded stays in the normal path color.
colorCurrentPath=The color of the current path
colorGoalBox=The color of the goal box
colorInvertedGoalBox=The color of the goal box when it's inverted
colorMostRecentConsidered=The color of the path to the most recent considered node
colorNextPath=The color of the next path
colorSelection=The color of all selections
colorSelectionPos1=The color of the selection pos 1
colorSelectionPos2=The color of the selection pos 2
considerPotionEffects=For example, if you have Mining Fatigue or Haste, adjust the costs of breaking blocks accordingly.
costHeuristic=This is the big A* setting. As long as your cost heuristic is an *underestimate*, it's guaranteed to find you the best path. 3.5 is always an underestimate, even if you are sprinting. If you're walking only (with allowSprint off) 4.6 is safe. Any value below 3.5 is never worth it. It's just more computation to find the same path, guaranteed. (specifically, it needs to be strictly slightly less than ActionCosts.WALK_ONE_BLOCK_COST, which is about 3.56). Setting it at 3.57 or above with sprinting, or to 4.64 or above without sprinting, will result in faster computation, at the cost of a suboptimal path. Any value above the walk / sprint cost will result in it going straight at its goal, and not investigating alternatives, because the combined cost / heuristic metric gets better and better with each block, instead of slightly worse. Finding the optimal path is worth it, so it's the default.
costVerificationLookahead=Stop 5 movements before anything that made the path COST_INF. For example, if lava has spread across the path, don't walk right up to it then recalculate, it might still be spreading lol
cutoffAtLoadBoundary=After calculating a path (potentially through cached chunks), artificially cut it off to just the part that is entirely within currently loaded chunks. Improves path safety because cached chunks are heavily simplified. This is much safer to leave off now, and makes pathing more efficient. More explanation in the issue.
desktopNotifications=Desktop notifications
disableCompletionCheck=Turn this on if your exploration filter is enormous, you don't want it to check if it's done, and you are just fine with it just hanging on completion
disconnectOnArrival=Disconnect from the server upon arriving at your goal
distanceTrim=Only build the goal from incorrect positions near you, plus the nearest few far ones when nothing near can be done. Far positions are still remembered. Helps performance in very large schematics
doBedWaypoints=allows baritone to save bed waypoints when interacting with beds
doDeathWaypoints=allows baritone to save death waypoints
echoCommands=Echo commands to chat when they are run
elytraAllowAboveBuildLimit=Allow the pathfinder to fly above the build limit in the overworld and end.
elytraAllowAboveRoof=Allow the pathfinder to fly above y 128 in the nether.
elytraAllowEmergencyLand=Automatically land when elytra is almost out of durability, or almost out of fireworks
elytraAllowLandOnNetherFortress=Should elytra consider nether brick a valid landing block
elytraAllowTightSpaces=Allow the pathfinder to attempt flight in tighter spaces, useful in caves but can be dangerous.
elytraAutoJump=Automatically path to and jump off of ledges to initiate elytra flight when grounded.
elytraAutoSwap=Automatically swap the current elytra with a new one when the durability gets too low
elytraCacheCullDistance=Maximum distance chunks can be before being culled from the nether pathfinder chunk cache
elytraChatSpam=Verbose chat logging in elytra mode
elytraConserveFireworks=If enabled, avoids using fireworks when descending along the flight path.
elytraFireworkSetbackUseDelay=The delay after the player's position is set-back by the server that a firework may be automatically deployed. Value is in ticks.
elytraFireworkSpeed=The minimum speed that the player can drop to (in blocks/tick) before a firework is automatically deployed.
elytraFreeLook=Automatically elytra fly without having to force the client-sided rotations.
elytraLongDistanceThreshold=Minimum distance in blocks of an elytra trip before the pathfinder will try to fly above build limit. (Minimum\: 32). Requires elytraAllowAboveBuildLimit to be enabled.
elytraMinFireworksBeforeLanding=The minimum fireworks before landing early for safety
elytraMinimumAvoidance=The minimum padding value that is added to the player's hitbox when considering which point to fly to on the path. High values can result in points not being considered which are otherwise safe to fly to. Low values can result in flight paths which are extremely tight, and there's the possibility of crashing due to getting too low to the ground.
elytraMinimumDurability=The minimum durability an elytra can have before being swapped
elytraNetherSeed=The seed used to generate chunks for long distance elytra path-finding in the nether. Defaults to 2b2t's nether seed.
elytraPitchRange=The maximum allowed deviation in pitch from a direct line-of-sight to the flight target. Higher values are computationally more expensive.
elytraPredictTerrain=Whether nether-pathfinder should generate terrain based on elytraNetherSeed. If false all chunks that haven't been loaded are assumed to be air.
elytraRenderHitboxRaytraces=Renders the raytraces that are used in the hitbox part of the elytra fly calculation. Requires elytraRenderRaytraces.
elytraRenderRaytraces=Renders the raytraces that are performed by the elytra fly calculation.
elytraRenderSimulation=Renders the best elytra flight path that was simulated each tick.
elytraSimulationTicks=The number of ticks of elytra movement to simulate while firework boost is not active. Higher values are computationally more expensive.
elytraSmoothLook=Same as smoothLook but for elytra flying.
elytraTermsAccepted=Has the user read and understood the elytra terms and conditions
elytraTimeBetweenCacheCullSecs=Time between culling far away chunks from the nether pathfinder chunk cache
elytraUseCache=Allow the pathfinder to access the baritone cache to improve pathing
enterPortal=When running a goto towards a nether portal block, walk all the way into the portal instead of stopping one block before.
experimentalBlockPlacementPenalty=While fastMode is on, the block placement penalty is the lower of blockPlacementPenalty and this. Placing a block really takes about a tick, so this is still pessimistic, just not so much that a two block bridge loses to a twenty block walk.
experimentalJumpBias=Multiplier on the cost of parkour, neo, climb and momentum jumps while fastMode is on. Below 1 makes the jumpy route look a bit cheaper than the equivalent walk, which is the whole fun of it.
exploreChunkSetMinimumSize=Take the 10 closest chunks, even if they aren't strictly tied for distance metric from origin.
exploreForBlocks=When GetToBlock or non-legit Mine doesn't know any locations for the desired block, explore randomly instead of giving up.
exploreMaintainY=Attempt to maintain Y coordinate while exploring. -1 to disable
extendCacheOnThreshold=When the cache scan gives less blocks than the maximum threshold (but still above zero), scan the main world too. Only if you have a beefy CPU and automatically mine blocks that are in cache
fadePath=Start fading out the path at 20 movements ahead, and stop rendering it entirely 30 movements ahead. Improves FPS.
failureTimeoutMS=Pathing can never take longer than this, even if that means failing to find any path at all
fallDamageCost=Cost, in ticks, of every half heart a damaging fall takes off you, while fastMode is on. Higher makes Baritone walk around a drop more often, lower makes it jump off things.
farmMaxScanSize=Farming will scan for at most this many blocks.
farmUsingSelection=When enabled, farming will be restricted to the current selection.
farmWaitForGrowth=Keep the farm process active when crops are present but none are mature enough to harvest yet. Disabled by default to preserve legacy behavior.
fastMode=Fast mode. Move like a speedrunner instead of a robot\: take the line a fast player would, accept some risk, use the flashy movement. While this is on, these settings behave as if they were on, whatever their own value (the settings themselves are left alone, so turning this off gives you your old choices back)\: allowParkour, allowParkourAscend, allowParkourPlace, allowLadderClutch, allowNeos, allowClimbJumps, allowMomentumJumps, allowTungstenJumps, allowDiagonalAscend, allowDiagonalDescend, sprintJumping, headHitters, allowGroundShortcuts, allowGodBridge, allowSwimming, allowBoats, elytraAutoJump and preferFasterPathing. It also scales the cost of parkour, neo, climb and momentum jumps by experimentalJumpBias, caps the cost of placing a block at experimentalBlockPlacementPenalty (so a quick pillar or short bridge can beat a long walk around), and allows falls that hurt, see fastModeMinHealth and fallDamageCost.
fastModeMinHealth=While fastMode is on, Baritone may take a fall that hurts when there is no water bucket or clutch to make it free, but never one that would leave you with less health (plus absorption) than this. Measured in half hearts, so 12 is six hearts. Damage is estimated as vanilla fall damage before armor and feather falling, which is conservative. Falls inside maxFallHeightNoWater only have to leave you alive.
fasterPathMinPercent=How much faster, in percent of the normal route's time, a route that needs blocks has to be before askToGatherForPath asks about it. The time it takes to collect the blocks counts against it. Both this and fasterPathMinSeconds have to hold.
fasterPathMinSeconds=How many seconds a route that needs blocks has to save, after counting the time to collect them, before askToGatherForPath asks about it. Both this and fasterPathMinPercent have to hold.
followOffsetDirection=The actual GoalNear is set in this direction from the entity you're following. This value is in degrees.
followOffsetDistance=The actual GoalNear is set this distance away from the entity you're following. For example, set followOffsetDistance to 5 and followRadius to 0 to always stay precisely 5 blocks north of your follow target.
followRadius=The radius (for the GoalNear) of how close to your target position you actually have to be
followTargetMaxDistance=The maximum distance to the entity you're following
forceInternalMining=When mining block of a certain type, try to mine two at once instead of one. If the block above is also a goal block, set GoalBlock instead of GoalTwoBlocks If the block below is also a goal block, set GoalBlock to the position one down instead of GoalTwoBlocks
freeLook=Move without having to force the client-sided rotations
gatherMaxBlocks=A path that would place more blocks than this is never worth asking about for askToGatherForPath.
gatherMaxRetries=After a yes for askToGatherForPath, how many more times the bot may go and collect blocks on the same trip without asking again (a long trip can run out halfway). Past this it stops with a message.
gatherPickaxeTicks=How many ticks making a stone pickaxe from nothing is guessed to take (a tree, a crafting table, some stone), for the faster route check of askToGatherForPath.
gatherTicksPerBlock=How many ticks collecting one block is guessed to take, for the faster route check of askToGatherForPath. On the slow side on purpose.
goalBreakFromAbove=As well as breaking from above, set a goal to up and to the side of all blocks to break. Never turn this on without also turning on breakFromAbove.
goalRenderLineWidthPixels=Line width of the goal when rendered, in pixels
guardAscends=Check the keys of a hop up a block against the movement sim, every tick, and let go of W (or of W and space) when holding them would run the hitbox into the face of the step. Up a staircase of full blocks every landing is a fraction of a block from the next face, so W and space clip it on every step. The sim looks about a dozen ticks ahead and, when the keys as the movement pressed them would clip, tries W released and then nothing at all. It is a safety net under the jump timing the ascend already asks the sim for, and only while sprinting. It saves the dead stop against the face, not the sprint\: letting go of W costs that for a tick too. At most 16 ticks per movement, after that the movement gets its keys back.
guiAnimations=Animate click gui transitions and scrolling. Disable to reduce motion and make changes immediate.
guiDarkMode=Use the dark appearance in the click gui. The sidebar's Light and Dark buttons save this preference.
guiKey=GLFW key code that opens the click gui. Defaults to right shift (344). Set to -1 to unbind so only \#gui opens it. The gui's own Settings tab has a key capture control for this.
guiKeyEnabled=Whether the gui key opens the click gui. The \#gui command always works.
guiMenuMusic=Play Soprano's own background music on the title screen and the other menus instead of the vanilla menu music. The speaker button in the top right corner of the title screen turns this on and off. Only does anything while guiMenus is on, in game the vanilla music plays as usual.
guiMenus=Draw Soprano's own boot screen and title screen instead of the vanilla ones. Turn this off if another mod restyles those screens, or to get the vanilla look back. The title screen switches the next time it opens.
headHitters=Sprint jump in 1x2 corridors and whenever walking under a low ceiling, bonking our head on it. The sprint jump speed boost applies before we hit the ceiling, making this faster than just sprinting.
headHittersDiagonal=Also sprint jump under low ceilings on flat diagonal movements when headHitters is enabled. Enabled by default. Disable this to limit head hitters to straight movements.
incorrectSize=The set of incorrect blocks can never grow beyond this size
internalMiningAirException=Modification to the previous setting, only has effect if forceInternalMining is true If true, only apply the previous setting if the block adjacent to the goal isn't air.
inventoryMoveOnlyIfStationary=Come to a halt before doing any inventory moves. Intended for anticheat such as 2b2t
itemSaver=Stop using tools just before they are going to break.
itemSaverThreshold=Durability to leave on the tool when using itemSaver
jumpPenalty=Additional penalty for hitting the space bar (ascend, pillar, or parkour) because it uses hunger
keepFpsWhileBotting=Count the bot's work as player activity for vanilla's AFK frame limiter. Since 1.21.2 the game drops to 30 fps after a minute without keyboard or mouse input (and 10 fps after ten minutes) when the inactivity limit option is on AFK, and the bot never touches the real keyboard or mouse, so the frame rate would tank while you watch it work. With this on, any tick where baritone is pathing, a process is in control, or Soprano is running a task counts as input. Does nothing while the bot is idle, so the AFK limiter still kicks in then, and your options are never changed. Takes effect right away.
keepPathOnSameGoal=When a task hands over to another one that asks for the same goal within half a second, keep walking the path that was just cancelled instead of standing still while a new one is calculated. Only cancels from movement tasks starting and stopping are kept. A user cancel, a dimension change, a death or the player ending up off the path always throw it away.
layerHeight=How high should the individual layers be?
layerOrder=false \= build from bottom to top. true \= build from top to bottom
learnFallFloor=When the server teleports you back up after a fall (a parkour server resetting you to a checkpoint), remember how low that fall went and don't plan to stand that low again in this world, as if avoidBelowY were set to it.
legitMine=Disallow MineBehavior from using X-Ray to see where the ores are. Turn this option on to force it to mine "legit" where it will only mine an ore once it can actually see it, so it won't do or know anything that a normal player couldn't. If you don't want it to look like you're X-Raying, turn this on This will always explore, regardless of exploreForBlocks
legitMineIncludeDiagonals=Magically see ores that are separated diagonally from existing ores. Basically like mining around the ores that it finds in case there's one there touching it diagonally, except it checks it un-legit-ly without having the mine blocks to see it. You can decide whether this looks plausible or not. This is disabled because it results in some weird behavior. For example, it can """see""" the top block of a vein of iron_ore through a lava lake. This isn't an issue normally since it won't consider anything touching lava, so it just ignores it. However, this setting expands that and allows it to see the entire vein so it'll mine under the lava lake to get the iron that it can reach without mining blocks adjacent to lava. This really defeats the purpose of legitMine since a player could never do that lol, so thats one reason why its disabled
legitMineYLevel=What Y level to go to for legit strip mining
logAsToast=Shows popup message in the upper right corner, similarly to when you make an advancement
mapArtMode=Build in map art mode, which makes baritone only care about the top block in each column
maxCachedWorldScanCount=After finding this many instances of the target block in the cache, it will stop expanding outward the chunk search.
maxCostIncrease=If a movement's cost increases by more than this amount between calculation and execution (due to changes in the environment / world), cancel and recalculate
maxFallHeightBucket=How far are you allowed to fall onto solid ground (with a water bucket)? It's not that reliable, so I've set it below what would kill an unarmored player (23). The bucket can still miss, and a miss is the whole fall, so a drop is only planned while you would survive that miss with at least half a heart left. At low health a tall drop is left out even with a bucket in hand.
maxFallHeightNoWater=How far are you allowed to fall onto solid ground (without a water bucket)? 3 won't deal any damage. But if you just want to get down the mountain quickly and you have Feather Falling IV, you might set it a bit higher, like 4 or 5. Only the first 3 blocks are planned as a free fall. Anything past that up to this limit is a fall that hurts, so a ladder or vine clutch (see allowLadderClutch) or a water bucket is used when one works, and otherwise the damage is priced in with fallDamageCost and the fall only happens if it leaves you alive.
maxPathHistoryLength=If we are more than 300 movements into the current path, discard the oldest segments, as they are no longer useful
maxYLevelWhileMining=Sets the maximum y level to mine ores at.
minYLevelWhileMining=Sets the minimum y level whilst mining - set to 0 to turn off. if world has negative y values, subtract the min world height to get the value to put here
mineDropLoiterDurationMSThanksLouca=While mining, wait this number of milliseconds after mining an ore to see if it will drop an item instead of immediately going onto the next one. Thanks Louca
mineGoalUpdateInterval=Rescan for the goal once every 5 ticks. Set to 0 to disable.
mineMaxOreLocationsCount=Mine will not scan for or remember more than this many target locations. Note that the number of locations retrieved from cache is additionaly limited by maxCachedWorldScanCount.
mineScanDroppedItems=While mining, should it also consider dropped items of the correct type as a pathing destination (as well as ore blocks)?
minimumImprovementRepropagation=Don't repropagate cost improvements below 0.01 ticks. They're all just floating point inaccuracies, and there's no point.
mobAvoidanceCoefficient=Set to 1.0 to effectively disable this feature. Set below 1.0 to go out of your way to walk near mobs
mobAvoidanceRadius=Distance to avoid mobs.
mobSpawnerAvoidanceCoefficient=Set to 1.0 to effectively disable this feature. Set below 1.0 to go out of your way to walk near mob spawners
mobSpawnerAvoidanceRadius=Distance to avoid mob spawners.
movementTimeoutTicks=If a movement takes this many ticks more than its initial cost estimate, cancel it
notificationOnBuildFinished=Desktop notification on build finished
notificationOnExploreFinished=Desktop notification on explore finished
notificationOnFarmFail=Desktop notification on farm fail
notificationOnMineFail=Desktop notification on mine fail
notificationOnPathComplete=Desktop notification on path complete
okIfAir=A list of blocks to become air. If a schematic asks for a block on this list, only air will be accepted at that location (and nothing on buildIgnoreBlocks)
okIfWater=Override builder's behavior to not attempt to correct blocks that are currently water
overshootTraverse=If we overshoot a traverse and end up one block beyond the destination, mark it as successful anyway. This helps with speed exceeding 20m/s
partialPathMaxDrop=When there's no path all the way to the goal yet, the bot sets off on the best part of one. That part may not end more than this many blocks below both where it starts and the goal (for a goal with a height, like \#goto x y z). On a parkour map the ground under the course is a dead end. The bot used to drop onto it early on, sure it would find a way back up later, and there wasn't one. Now it only goes lower when there's really nothing else at this height\: it has already been stuck right here, and nothing is still being worked out in the background. -1 turns this off.
pathCutoffFactor=Static cutoff factor. 0.9 means cut off the last 10% of all paths, regardless of chunk load state
pathCutoffMinimumLength=Only apply static cutoff for paths of at least this length (in terms of number of movements)
pathHistoryCutoffAmount=If the current path is too long, cut off this many movements from the beginning.
pathRenderLineWidthPixels=Line width of the path when rendered, in pixels
pathThroughCachedOnly=Exclusively use cached chunks for pathing. Never turn this on
pathingCacheSize=Number of entries in each block-state and mining-cost cache used during a path search. Rounded up to a power of two and clamped between 1024 and 65536. Smaller caches reduce memory usage but may require more block lookups. The size is captured when a calculation context is created. Worker threads reuse the arrays between searches, clearing their keys each time.
pathingMapDefaultSize=Default size of the Long2ObjectOpenHashMap used in pathing
pathingMapLoadFactor=Load factor coefficient for the Long2ObjectOpenHashMap used in pathing. Decrease for faster map operations, but higher memory usage
pathingMaxChunkBorderFetch=The maximum number of times it will fetch outside loaded or cached chunks before assuming that pathing has reached the end of the known area, and should therefore stop.
pauseMiningForFallingBlocks=When breaking blocks for a movement, wait until all falling blocks have settled before continuing
pickupLadders=After a ladder clutch, break the ladder we put on the wall and pick it back up, so one ladder can save you from as many long falls as you like. Only ladders we placed ourselves are touched, never one that was already there. Vines need shears to drop anything, so those stay on the wall. If the ladder can't be reached or it takes too long, we just leave it and carry on. Costs a second or so per clutch, which the pathing knows about.
placeIncorrectBlockPenaltyMultiplier=Multiply the cost of placing a block that's incorrect in the builder's schematic by this coefficient
planAheadFailureTimeoutMS=Planning ahead while executing a segment can never take longer than this, even if that means failing to find any path at all
planAheadPrimaryTimeoutMS=Planning ahead while executing a segment ends after this amount of time, but only if a path has been found. If no valid path (length above the minimum) has been found, pathing continues up until the failure timeout
planningTickLookahead=Start planning the next path once the remaining movements tick estimates sum up to less than this value
preferFasterPathing=Prefer paths and steering that preserve walking and sprinting momentum. Look ahead along clear, supported straight runs instead of steering at each block center. Diagonals that require edging around an obstacle receive an extra cost; open diagonals keep their normal cost. Turns, terrain changes, and block interactions retain precise steering. Part of fastMode.
preferSilkTouch=Always prefer silk touch tools over regular tools. This will not sacrifice speed, but it will always prefer silk touch tools over other tools of the same speed. This includes always choosing ANY silk touch tool over your hand.
prefix=The command prefix for chat control
prefixControl=Whether or not to allow you to run Baritone commands with the prefix
primaryTimeoutMS=Pathing ends after this amount of time, but only if a path has been found. If no valid path (length above the minimum) has been found, pathing continues up until the failure timeout
pruneRegionsFromRAM=On save, delete from RAM any cached regions that are more than 1024 blocks away from the player. Temporarily disabled. Temporarily reenabled
randomLooking=How many degrees to randomize the pitch and yaw every tick. Set to 0 to disable
randomLooking113=How many degrees to randomize the yaw every tick. Set to 0 to disable
recordMovementTimings=Measure how long every movement really takes against what the planner said it would, and keep the numbers. For each movement the executor runs from its first tick to success without a pause, a cancel, a resync or a jump ahead in the path, it writes one line to movement-timings.csv in the baritone folder of your minecraft folder (next to settings.txt)\: the movement kind and offset, the planned ticks, the real ticks, and a few flags (blocks broken and placed, sprinting, in water, standing still at the start, the floor under the start, fastMode). Lines are batched and written by a background thread a few seconds after they happen, never on the game thread. The file is capped at 4 MiB\: when it is full it is renamed to movement-timings.csv.old (replacing the older one) and a fresh one starts, so at most about 8 MiB is ever used. Use the timings command to print which movements are off the most, and timings clear to throw the data away. This only measures. Nothing reads the numbers back to change a cost, and with this off the executor only reads this setting once per movement and does nothing else.
remainWithExistingLookDirection=When true, the player will remain with its existing look direction as often as possible. Although, in some cases this can get it stuck, hence this setting to disable that behavior.
renderBoxFill=Fill the goal box and the selection boxes (to break, to place, to walk into) with a faint tint, instead of only drawing their outlines
renderCachedChunks=\uD83D\uDE0E Render cached chunks as semitransparent. Doesn't work with OptiFine \uD83D\uDE2D Rarely randomly crashes, see this issue. Can be very useful on servers with low render distance. After enabling, you may need to reload the world in order for it to have an effect (e.g. disconnect and reconnect, enter then exit the nether, die and respawn, etc). This may literally kill your FPS and CPU because every chunk gets recompiled twice as much as normal, since the cached version comes into range, then the normal one comes from the server for real. Note that flowing water is cached as AVOID, which is rendered as lava. As you get closer, you may therefore see lava falls being replaced with water falls. SOLID is rendered as stone in the overworld, netherrack in the nether, and end stone in the end
renderGoal=Render the goal
renderGoalAnimated=Render the goal as a sick animated thingy instead of just a box (also controls animation of GoalXZ if renderGoalXZBeacon is enabled)
renderGoalIgnoreDepth=Ignore depth when rendering the goal
renderGoalXZBeacon=Renders X/Z type Goals as a no-depth beacon beam instead of the full-height goal box.
renderPath=Render the path
renderPathAnimated=Let a faint shimmer drift down the path, in the direction of travel. Only does anything when renderPathRibbon is on.
renderPathAsLine=Render the path as a line instead of a frickin thingy
renderPathIgnoreDepth=Ignore depth when rendering the path
renderPathRibbon=Render the path with soft edges, rounded corners and a tail that fades out behind you. It's still the same floating line, pathRenderLineWidthPixels wide, with the same bit of height to it unless renderPathAsLine is on. When this is false you get the classic gl lines back.
renderSearchSmooth=Smooth out the rendering of the path calculation, so that the best path grows and fades instead of flickering around, and the most recent nodes branch off it as a tree. Only does anything when renderPathRibbon is on.
renderSelection=Render selections
renderSelectionBoxes=Render selection boxes
renderSelectionBoxesIgnoreDepth=Ignore depth when rendering the selection boxes (to break, to place, to walk into)
renderSelectionCorners=Render selection corners
renderSelectionIgnoreDepth=Ignore depth when rendering selections
repackOnAnyBlockChange=Whenever a block changes, repack the whole chunk that it's in
replantCrops=Replant normal Crops while farming and leave cactus and sugarcane to regrow
replantNetherWart=Replant nether wart while farming. This setting only has an effect when replantCrops is also enabled
rightClickContainerOnArrival=When running a goto towards a container block (chest, ender chest, furnace, etc), right click and open it once you arrive.
rightClickSpeed=How many ticks between right clicks are allowed. Default in game is 4
schematicFallbackExtension=The fallback used by the build command when no extension is specified. This may be useful if schematics of a particular format are used often, and the user does not wish to have to specify the extension with every usage.
schematicGhostAlpha=How see-through the ghost blocks of the schematic picked in the gui's Schematics tab are, from 0 to 1. Below 0.1 nothing is drawn.
schematicGhostDistance=How far from the camera, in blocks, the ghost blocks of the schematic picked in the gui's Schematics tab are drawn (8 to 128).
schematicOrientationX=When this setting is true, build a schematic with the highest X coordinate being the origin, instead of the lowest
schematicOrientationY=When this setting is true, build a schematic with the highest Y coordinate being the origin, instead of the lowest
schematicOrientationZ=When this setting is true, build a schematic with the highest Z coordinate being the origin, instead of the lowest
selectionLineWidth=Line width of the goal when rendered, in pixels
selectionOpacity=The opacity of the selection. 0 is completely transparent, 1 is completely opaque
selfDefense=Hit back while a Baritone job (mine, tunnel, build, farm, follow, goto, explore) is running. When a hostile mob hits you and is within melee reach, the job pauses where it is, the bot takes out its best sword (or axe) from the hotbar and hits the mob until it dies or walks off, then puts the old item back and carries on with the job. It never chases or paths anywhere, it only swings at what is already in reach, and it gives up on a mob it can't hit or can't hurt after a few seconds. Creepers, wardens, withers, creakings, the dragon and the flying ones (phantoms, vexes, ghasts, blazes) are left alone. It stays out of the way in water, in lava, while flying an elytra and while a chest or other container is open. Tasks like \#get and \#gamer have their own combat, so this does nothing while one of those is running.
shortBaritonePrefix=Use a short prefix [S] instead of [Soprano] when logging to chat
simplifyUnloadedYCoord=If your goal is a GoalBlock in an unloaded chunk, assume it's far enough away that the Y coord doesn't matter yet, and replace it with a GoalXZ to the same place before calculating a path. Once a segment ends within chunk load range of the GoalBlock, it will go back to normal behavior of considering the Y coord. The reasoning is that if your X and Z are 10,000 blocks away, your Y coordinate's accuracy doesn't matter at all until you get much much closer.
skipFailedLayers=If a layer is unable to be constructed, just skip it.
slowPath=For debugging, consider nodes much much slower
slowPathTimeDelayMS=Milliseconds between each node
slowPathTimeoutMS=The alternative timeout number when slowPath is on
smoothCombatAim=Turn onto mobs in melee a few degrees per tick, the way a hand on a mouse does, instead of snapping the camera onto them. The turn starts slow, speeds up and settles on a point inside the middle of the mob, then tracks it as it moves. Swings only go out once the crosshair is really on the mob. randomLooking113 and randomLooking still bound how far the aim wanders while it holds on a target, as a slow drift instead of a per tick shake. Off snaps onto the same point in one tick, with the same rules about when a swing may go out.
smoothLook=Forces the client-sided yaw rotation to an average of the last smoothLookTicks of server-sided rotations.
smoothLookTicks=The number of ticks to average across for smoothLook;
splicePath=When a new segment is calculated that doesn't overlap with the current one, but simply begins where the current segment ends, splice it on and make a longer combined path. If this setting is off, any planned segment will not be spliced and will instead be the "next path" in PathingBehavior, and will only start after this one ends. Turning this off hurts planning ahead, because the next segment will exist even if it's very short.
sprintAscends=Sprint and jump a block early on ascends wherever possible. The sprint also carries through a hop into the next traverse, ascend or descend when the path goes straight on, instead of dropping in mid air and landing at walk speed. It also carries on up a whole flight of straight stairs climbed from the low side (bottom half, no corner shape, from a full height floor). Those are walked and not jumped whatever this is set to, the way vanilla steps up a half block.
sprintInWater=Continue sprinting while in water
sprintJumping=Sprint jump along straight stretches of path, up single block steps and down small hills. Every jump is simulated first and only happens if it lands back on the path without fall damage. Also sprints over 1 and 2 block parkour gaps, when you reach them already sprinting and the path carries on straight for a block or two past the landing. The jump brakes in the air if it would fly past, and the planner prices those jumps as the sprint hops they are. Anywhere that does not hold, they are walked up to the edge like before.
sprintJumpingDiagonals=Also sprint jump along flat diagonal stretches of path when sprintJumping is enabled.
sprintTelemetry=Debug logging for sprint that drops when it should not have, and for how well the movement sim predicts the player. Every tick the player was sprinting at the start of the last tick and is not now, while a path is being walked, one line says which movement it was and the ones around it, who was steering, where the feet were, the collision flags the drop was decided from (and which blocks the hitbox was leaning on), the forward input, the food, what the executor wanted and why it said no, which ascend rule pressed space last and what the sim had said about it, and whether a pause let go of the keys. A line follows when sprint comes back. Every ascend takeoff gets a line too. The report comes when the path ends or is stopped and every 1000 path ticks\: drops (the ones at the very end of a path counted apart), how long sprint stayed off, by cause and by movement, so two runs can be compared. Every tick the sim of the player's own movement is run from the state the tick started in with the inputs that were really sent, the result is held against what really happened next, and a line is logged when the position is off by more than 0.01 or the sprint, ground or collision flags differ. Lines go to the debug log (chat, if chatDebug is on) and to the game log with a [sprintTelemetry] prefix. It is a lot of text, so it is off by default, and fastMode does not turn it on.
sprintThroughCorners=Keep sprinting through corners that need 60 degrees of turning or less, and start rotating a fraction of a block early so the corner is cut instead of clipped. Sharp turns (90 degrees and up) next to hazards, and corners in 1 wide corridors where cutting would clip a wall, keep their normal steering. Does nothing in the nether, within 3 blocks of lava, at 6 health or less, or while a nearby movement is placing blocks or breaking anything that is not gone the moment it is clicked.
sprintThroughDescends=Keep sprinting down a ledge, step or small fall (3 blocks at most) when the path carries on in roughly the same direction (within 45 degrees) and the blocks you would coast over after landing are safe\: no lava, fire, magma, powder snow, cactus, berry bushes, water or void, and no drop deeper than the one the path already planned. Does nothing in the nether, within 3 blocks of lava, at 6 health or less, or while a nearby movement is placing blocks or breaking anything that is not gone the moment it is clicked (leaves with shears, netherrack with a fast pick; two such breaks at most). Those keep the old stop-sprinting-on-every-descend behavior.
startAtLayer=Start building the schematic at a specific layer. Can help on larger builds when schematic wants to break things its already built
strictLiquidCheck=Don't allow breaking blocks next to liquids. Enable if you have mods adding custom fluid physics.
ticksBetweenInventoryMoves=Wait this many ticks between InventoryBehavior moving inventory items
tungstenPlannerBudget=How much simulation one path search may spend on allowTungstenJumps, in simulated player ticks (each is a few microseconds). Once it's spent the search carries on without offering any more of them.
tungstenSearchBudget=How much simulation a full Tungsten search may spend, in simulated player ticks\: the \#tungsten command, and a Tungsten jump whose rule found nothing from where the player was. Runs off the game thread.
useMessageTag=Use a modern message tag instead of a prefix when logging to chat
useSwordToMine=Use sword to mine.
verboseCommandExceptions=Print out ALL command exceptions as a stack trace to stdout, even simple syntax errors
walkOnWaterOnePenalty=Walking on water uses up hunger really quick, so penalize it
walkWhileBreaking=Don't stop walking forward when you need to break blocks in your way
waterBreakCostMultiplier=How much slower breaking blocks is while standing in water, as far as the path cost is concerned. Vanilla mines 5x slower with your eyes in water (no aqua affinity) and another 5x slower when you are not on the ground, so treading water is up to 25x. Movements that break something while the player stands in water pay this much (times 5 again if there is nothing solid under the feet) for the break part of their cost, so the pathfinder would rather get out of the water first and mine on land. It only ever makes things more expensive, it never makes a move impossible. Set it to 1 to turn it off.
worldExploringChunkOffset=While exploring the world, offset the closest unloaded chunk by this much in both axes. This can result in more efficient loading, if you set this to the render distance.
yLevelBoxSize=The size of the box that is rendered when the current goal is a GoalYLevel
