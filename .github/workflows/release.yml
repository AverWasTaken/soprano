# builds the jars and makes a github release when a tag like soprano-v1.1.0 is pushed
# laid out like baritone's releases: every jar flavor plus checksums.txt, and a one line note saying which minecraft
# version and loaders. each minecraft version branch gets its own version line (1.0.x is 1.21.4, 1.1.x is 26.3), see CONTRIBUTING.md

name: Release

on:
  push:
    tags:
      - 'soprano-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Work out the version from the tag
      run: |
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#soprano-v}"
        MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        JAVA_VERSION="$(grep '^java_version=' gradle.properties | cut -d= -f2)"
        echo "MC_VERSION=${MC_VERSION}" >> "$GITHUB_ENV"
        echo "JAVA_VERSION=${JAVA_VERSION}" >> "$GITHUB_ENV"

    - name: Set up the JDK this branch wants
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="$VERSION" -Prelease_version="$VERSION"

    - name: Check the jars have the right version in their names
      run: |
        ls -l dist/
        test -n "$(ls dist/soprano-api-fabric-"$VERSION".jar 2>/dev/null)" || { echo "dist/ is missing soprano-api-fabric-$VERSION.jar"; exit 1; }

    - name: Write the release notes
      run: |
        # same one liner baritone's releases have, only naming the loaders we actually built
        NOTES="For Minecraft ${MC_VERSION}."
        ls dist/soprano-api-forge-*.jar >/dev/null 2>&1 && NOTES="${NOTES} Forge is supported."
        ls dist/soprano-api-fabric-*.jar >/dev/null 2>&1 && NOTES="${NOTES} Fabric is supported."
        ls dist/soprano-api-neoforge-*.jar >/dev/null 2>&1 && NOTES="${NOTES} NeoForge is supported."
        echo "$NOTES" > release-notes.md
        # the what's fixed list lives in release-notes/<version>.md, tack it on when there is one
        if [ -f "release-notes/${VERSION}.md" ]; then
          echo "" >> release-notes.md
          cat "release-notes/${VERSION}.md" >> release-notes.md
        fi
        cat release-notes.md

    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # only the jars people download: api per loader, plus unoptimized fabric for readable crash logs.
        # standalone and the loader-less jars sat at 0 downloads, so they don't ship
        FILES=""
        for f in "dist/soprano-api-fabric-${VERSION}.jar" "dist/soprano-api-forge-${VERSION}.jar" \
                 "dist/soprano-api-neoforge-${VERSION}.jar" "dist/soprano-unoptimized-fabric-${VERSION}.jar"; do
          [ -f "$f" ] && FILES="$FILES $f"
        done
        gh release create "$GITHUB_REF_NAME" --title "Soprano v${VERSION}" --notes-file release-notes.md $FILES

    # a release made with this token never fires the release event, so discord.yml wouldn't see it
    - name: Post the release to discord
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python3 .github/scripts/discord_release.py "$GITHUB_REF_NAME" "${{ github.repository }}"
