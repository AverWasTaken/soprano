# builds the jars and makes a github release when a tag like soprano-v1.1.0 is pushed
# the api jar per loader plus unoptimized fabric, and a one line note saying which minecraft
# version and loaders. each minecraft version branch gets its own version line (1.0.x is 1.21.4, 1.1.x is 26.3, 1.2.x is 1.21.11), see CONTRIBUTING.md
# soprano-v1.1.7-nightly.1 (and -nightly.1-anyversion) is a nightly: pre-release, an "expect bugs" line on top

name: Release

on:
  push:
    tags:
      - 'soprano-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Work out the version from the tag
      run: |
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#soprano-v}"
        MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        # soprano-v1.1.5-anyversion is the version-agnostic build: same number, pre-release, fabric only
        BASE="${VERSION%-anyversion}"
        ANYVERSION=0
        if [ "$BASE" != "$VERSION" ]; then ANYVERSION=1; fi
        echo "BASE_VERSION=${BASE}" >> "$GITHUB_ENV"
        echo "ANYVERSION=${ANYVERSION}" >> "$GITHUB_ENV"
        # 1.1.7-nightly.1 or 1.1.7-nightly.1-anyversion. the in-game updater only offers these to nightly players
        NIGHTLY=0
        case "$VERSION" in
          *-nightly.*) NIGHTLY=1 ;;
        esac
        echo "NIGHTLY=${NIGHTLY}" >> "$GITHUB_ENV"
        JAVA_VERSION="$(grep '^java_version=' gradle.properties | cut -d= -f2)"
        echo "MC_VERSION=${MC_VERSION}" >> "$GITHUB_ENV"
        echo "JAVA_VERSION=${JAVA_VERSION}" >> "$GITHUB_ENV"

    - name: Set up the JDK this branch wants
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="$VERSION" -Prelease_version="$VERSION"

    - name: Check the jars have the right version in their names
      run: |
        ls -l dist/
        test -n "$(ls dist/soprano-api-fabric-"$VERSION".jar 2>/dev/null)" || { echo "dist/ is missing soprano-api-fabric-$VERSION.jar"; exit 1; }

    - name: Write the release notes
      run: |
        # same one liner baritone's releases have, only naming the loaders we actually built
        NOTES="For Minecraft ${MC_VERSION}."
        ls dist/soprano-api-forge-*.jar >/dev/null 2>&1 && NOTES="${NOTES} Forge is supported."
        ls dist/soprano-api-fabric-*.jar >/dev/null 2>&1 && NOTES="${NOTES} Fabric is supported."
        ls dist/soprano-api-neoforge-*.jar >/dev/null 2>&1 && NOTES="${NOTES} NeoForge is supported."
        # the any version build only ships fabric and runs on a 26.3 client against any server,
        # so the usual line would be lying
        if [ "$ANYVERSION" = "1" ]; then
          NOTES="This version is base ${MC_VERSION} MC that is compatible with every server version. May be bug prone. Fabric only."
        fi
        # nightlies say so before anything else, people grab whatever is on top of the releases page
        if [ "$NIGHTLY" = "1" ]; then
          printf '%s\n\n' "**Nightly build.** Expect bugs. This is not a confirmed stable release." > release-notes.md
          echo "$NOTES" >> release-notes.md
        else
          echo "$NOTES" > release-notes.md
        fi
        # the what's fixed list lives in release-notes/<version>.md, tack it on when there is one
        if [ -f "release-notes/${VERSION}.md" ]; then
          echo "" >> release-notes.md
          cat "release-notes/${VERSION}.md" >> release-notes.md
        fi
        cat release-notes.md

    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # only the jars people download: api per loader, plus unoptimized fabric for readable crash logs.
        # standalone and the loader-less jars sat at 0 downloads, so they don't ship
        # the any version build bundles viafabricplus, which is fabric only, so the other loaders stay home
        CANDIDATES="dist/soprano-api-fabric-${VERSION}.jar dist/soprano-api-forge-${VERSION}.jar dist/soprano-api-neoforge-${VERSION}.jar dist/soprano-unoptimized-fabric-${VERSION}.jar"
        if [ "$ANYVERSION" = "1" ]; then
          CANDIDATES="dist/soprano-api-fabric-${VERSION}.jar dist/soprano-unoptimized-fabric-${VERSION}.jar"
        fi
        FILES=""
        for f in $CANDIDATES; do
          [ -f "$f" ] && FILES="$FILES $f"
        done

        # the in-game updater picks releases by the "(MC)" / "(base MC)" at the end of these titles, keep that format
        TITLE="Soprano v${VERSION} (${MC_VERSION})"
        if [ "$ANYVERSION" = "1" ]; then
          TITLE="Soprano v${BASE_VERSION} Any Version (base ${MC_VERSION})"
        fi

        # github hands out latest by semver, so 1.2.0 on 1.21.11 would steal it from 26.3. spell it out every time.
        # anything with a hyphen (anyversion, nightly, both) is a pre-release and never latest
        FLAGS="--latest=false"
        case "$VERSION" in
          *-*) FLAGS="--latest=false --prerelease" ;;
          *) if [ "$MC_VERSION" = "26.3" ]; then FLAGS="--latest"; fi ;;
        esac

        echo "title: $TITLE"
        echo "flags: $FLAGS"
        echo "files:$FILES"
        gh release create "$GITHUB_REF_NAME" --title "$TITLE" $FLAGS --notes-file release-notes.md $FILES
