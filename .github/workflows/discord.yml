# tells discord about a release made by hand on github. releases made by release.yml post from there,
# since a release created with the workflow's own token never fires this event

name: Discord

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Post the release to discord
      # nightlies stay quiet here too, same as release.yml
      if: ${{ !contains(github.event.release.tag_name, '-nightly.') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python3 .github/scripts/discord_release.py "${{ github.event.release.tag_name }}" "${{ github.repository }}"
